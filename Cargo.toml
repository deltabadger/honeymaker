[workspace]
members = ["crates/honeymaker", "ext/honeymaker_native"]
resolver = "3"

[workspace.package]
version = "0.12.2" # lockstep with lib/honeymaker/version.rb (test/native/lockstep_test.rb)
edition = "2024"
rust-version = "1.94"
license = "MIT"
repository = "https://github.com/deltabadger/honeymaker"

[profile.release]
lto = true
codegen-units = 1
