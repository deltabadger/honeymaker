name: Native gems

on:
  pull_request:
    paths: ["crates/**", "ext/**", "Cargo.*", "rust-toolchain.toml", "honeymaker.gemspec", "Rakefile",
            "lib/honeymaker/native.rb", "test/smoke.rb", ".github/workflows/native-gems.yml"]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cross:
    strategy:
      fail-fast: false
      matrix:
        platform: [x86_64-linux, aarch64-linux, x86_64-darwin, arm64-darwin, x64-mingw-ucrt]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - uses: oxidize-rb/actions/cross-gem@ec90b4aa48795518d79be3f5cc478d1d7ccd02a8 # v1.5.0
        id: cross
        with:
          platform: ${{ matrix.platform }}
          ruby-versions: "3.4,4.0"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gem-${{ matrix.platform }}
          path: ${{ steps.cross.outputs.gem-path }}

  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - run: bundle exec rake build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gem-ruby
          path: pkg/honeymaker-*.gem

  source-install:
    needs: source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: "4.0"
      - run: rustup toolchain install 1.94.0 --profile minimal
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: gem-ruby
          path: gems
      - run: gem install --no-document --platform ruby gems/*.gem
        env:
          RUSTUP_TOOLCHAIN: "1.94.0"
      - run: ruby test/smoke.rb
        env:
          EXPECT_PLATFORM: ruby

  smoke:
    needs: cross
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, platform: x86_64-linux, ruby: "3.4" }
          - { os: ubuntu-latest, platform: x86_64-linux, ruby: "4.0" }
          - { os: ubuntu-24.04-arm, platform: aarch64-linux, ruby: "3.4" }
          - { os: ubuntu-24.04-arm, platform: aarch64-linux, ruby: "4.0" }
          - { os: macos-15-intel, platform: x86_64-darwin, ruby: "3.4" }
          - { os: macos-15-intel, platform: x86_64-darwin, ruby: "4.0" }
          - { os: macos-14, platform: arm64-darwin, ruby: "3.4" }
          - { os: macos-14, platform: arm64-darwin, ruby: "4.0" }
          - { os: windows-latest, platform: x64-mingw-ucrt, ruby: "3.4" }
          - { os: windows-latest, platform: x64-mingw-ucrt, ruby: "4.0" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: ${{ matrix.ruby }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: gem-${{ matrix.platform }}
          path: gems
      - run: gem install --no-document gems/*.gem
        shell: bash
      - run: ruby test/smoke.rb
        env:
          EXPECT_PLATFORM: ${{ matrix.platform }}
