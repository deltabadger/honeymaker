[package]
name = "honeymaker-client"
description = "Async transport and venue clients over the honeymaker core, for Rust callers (not in the gem build)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
honeymaker = { path = "../honeymaker" }
base64 = "0.22"
bigdecimal = "0.4"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
flate2 = "1" # default backend is miniz_oxide (pure Rust)
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = "1"
serde_json = { version = "1", features = ["preserve_order", "arbitrary_precision"] }
tokio = { version = "1", features = ["net", "time", "io-util", "macros"] } # macros: tokio::join! in Transport::send
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1"

[dev-dependencies]
rcgen = "0.13"
tokio = { version = "1", features = ["macros", "rt", "test-util", "net", "time", "io-util", "sync"] } # sync: the tests' async nonce lock
